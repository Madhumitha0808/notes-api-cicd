name: CI/CD Pipeline

# Step A: When should this robot wake up? Whenever code is pushed to 'main'.
on:
  push:
    branches: [ "main" ]

# Step B: Give the robot permission to save Docker images in GitHub Packages.
permissions:
  contents: read
  packages: write

jobs:
  # JOB 1: Test the code
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code from the repo
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest

  # JOB 2: Build and store the Docker image (only runs if tests pass!)
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download the code from the repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker image tag name
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and push the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}